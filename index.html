    <script>
      // Suppress any dev-server Vite HMR WebSocket connection errors in sandbox
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          const NativeWS = window.WebSocket;
          function SafeWebSocket(url, protocols) {
            try {
              const urlStr = String(url || '');
              if (urlStr.includes('vite') || urlStr.includes('hmr') || urlStr.startsWith('ws://') || urlStr.startsWith('wss://')) {
                return {
                  url: urlStr,
                  readyState: 3,
                  send: function() {},
                  close: function() {},
                  addEventListener: function() {},
                  removeEventListener: function() {},
                  dispatchEvent: function() { return false; },
                  onopen: null,
                  onclose: null,
                  onerror: null,
                  onmessage: null
                };
              }
            } catch (e) {}
            return new NativeWS(url, protocols);
          }
          SafeWebSocket.prototype = NativeWS.prototype;
          SafeWebSocket.CONNECTING = 0;
          SafeWebSocket.OPEN = 1;
          SafeWebSocket.CLOSING = 2;
          SafeWebSocket.CLOSED = 3;
          window.WebSocket = SafeWebSocket;
        }
      })();
    </script>
  </head>
